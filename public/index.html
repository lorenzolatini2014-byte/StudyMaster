<script>
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(tabId).style.display = 'block';
      btn.classList.add('active');
    }

    async function handleFileUpload(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      document.getElementById('fileInfo').innerText = "⏳ Caricamento file: " + file.name;

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.text) {
          document.getElementById('inputText').value = data.text;
          document.getElementById('fileInfo').innerText = "✅ File caricato ed estratto con successo!";
        }
      } catch (e) {
        document.getElementById('fileInfo').innerText = "✅ File selezionato: " + file.name;
      }
    }

    // --- VOCE FLUIDA E NATURALE (Stile Live AI) ---
    let isSpeaking = false;
    let synth = window.speechSynthesis;
    let selectedVoice = null;

    // Seleziona la voce italiana più fluida e naturale disponibile nel browser
    function loadBestVoice() {
      const voices = synth.getVoices();
      // Cerca voci di alta qualità in italiano (es. Google italiano, Microsoft Natural o Siri)
      selectedVoice = voices.find(v => v.lang.includes('it') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Siri'))) ||
                      voices.find(v => v.lang.includes('it')) || voices[0];
    }

    if (synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = loadBestVoice;
    }

    function toggleAudio() {
      if (isSpeaking) {
        synth.cancel();
        isSpeaking = false;
        document.getElementById('playAudioBtn').innerText = "🔊 Ascolta Vocale Fluida";
        document.getElementById('audioStatus').innerText = "In pausa";
      } else {
        const text = document.getElementById('podcastScript').innerText;
        if (!text) return;

        loadBestVoice();
        const utter = new SpeechSynthesisUtterance(text);
        if (selectedVoice) utter.voice = selectedVoice;
        
        utter.lang = 'it-IT';
        utter.rate = 0.95; // Velocità leggermente più umana e rilassata
        utter.pitch = 1.0; // Tono naturale

        utter.onend = () => {
          isSpeaking = false;
          document.getElementById('playAudioBtn').innerText = "🔊 Ascolta Vocale Fluida";
          document.getElementById('audioStatus').innerText = "Riproduzione completata";
        };

        synth.speak(utter);
        isSpeaking = true;
        document.getElementById('playAudioBtn').innerText = "⏸️ Pausa Audio";
        document.getElementById('audioStatus').innerText = "🎙️ Conversazione vocale in corso...";
      }
    }

    async function generatePodcast() {
      const text = document.getElementById('inputText').value;
      document.getElementById('podcastOutput').style.display = 'block';
      document.getElementById('podcastScript').innerText = "Creazione della presentazione audio dettagliata in corso...";

      try {
        const res = await fetch('/api/podcast', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        document.getElementById('podcastScript').innerText = data.script;
      } catch (e) {
        document.getElementById('podcastScript').innerText = "Errore nella generazione del podcast.";
      }
    }

    async function generateSummary() {
      const text = document.getElementById('inputText').value;
      const box = document.getElementById('summaryResult');
      box.style.display = 'block';
      box.innerText = "Creazione riassunto...";

      try {
        const res = await fetch('/api/summary', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        box.innerHTML = `<strong>${data.title}</strong><p>${data.summary}</p><ul>` + 
          data.key_points.map(p => `<li>${p}</li>`).join('') + `</ul>`;
      } catch (e) {
        box.innerText = "Errore durante la generazione.";
      }
    }

    async function generateQuiz() {
      const text = document.getElementById('inputText').value;
      const box = document.getElementById('quizResult');
      box.style.display = 'block';
      box.innerText = "Generazione quiz...";

      try {
        const res = await fetch('/api/quiz', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        box.innerHTML = data.questions.map(q => `
          <div style="margin-bottom:15px;">
            <strong>Domanda ${q.id}: ${q.question}</strong><br>
            ${q.options.join('<br>')}<br>
            <small style="color: green;">💡 Soluzione: ${q.correct} - ${q.explanation}</small>
          </div>
        `).join('');
      } catch (e) {
        box.innerText = "Errore durante la generazione.";
      }
    }

    async function generateMap() {
      const text = document.getElementById('inputText').value;
      const box = document.getElementById('mapResult');
      box.style.display = 'block';
      box.innerText = "Generazione mappa...";

      try {
        const res = await fetch('/api/map', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        box.innerHTML = data.nodes.map(n => `
          <div style="padding: 8px; border-left: 3px solid var(--primary-red); margin-bottom: 8px; background: #fff;">
            <strong>${n.title}</strong>: ${n.desc}
          </div>
        `).join('');
      } catch (e) {
        box.innerText = "Errore durante la generazione.";
      }
    }
  </script>
